name: Build Node.js ARMv7

on:
  schedule:
    # Run weekly on Tuesdays at 00:00 UTC (~4.5h before YoutubeDL-Material build)
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to build (e.g. 24.0.0). Leave blank to use latest Node 24.'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild even if release already exists'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: build-node-armv7
  cancel-in-progress: false

env:
  NODE_MAJOR: 24
  ARCH: armv7l

jobs:
  check-version:
    name: Resolve Target Version
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.resolve.outputs.node_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      already_exists: ${{ steps.check_release.outputs.already_exists }}
    steps:
      - name: Resolve Node.js version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.node_version }}" ]; then
            VERSION="${{ github.event.inputs.node_version }}"
          else
            VERSION=$(curl -fsSL https://nodejs.org/dist/latest-v${{ env.NODE_MAJOR }}.x/SHASUMS256.txt \
              | head -1 | grep -oP 'node-v\K[0-9]+\.[0-9]+\.[0-9]+')
          fi
          echo "node_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION}-armv7l" >> $GITHUB_OUTPUT
          echo "Resolved Node.js version: ${VERSION}"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.resolve.outputs.node_version }}-armv7l"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "already_exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists."
          else
            echo "already_exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG does not exist yet, proceeding with build."
          fi

  build:
    name: Build Node.js ${{ needs.check-version.outputs.node_version }} for ARMv7
    needs: check-version
    runs-on: ubuntu-24.04
    if: needs.check-version.outputs.already_exists == 'false' || github.event.inputs.force_rebuild == 'true'
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build Node.js natively in ARM container
        run: |
          VERSION="${{ needs.check-version.outputs.node_version }}"
          TARNAME="node-v${VERSION}-linux-armv7l"

          # Run the entire build inside a native ARM container.
          # QEMU user-mode emulation makes this transparent — the
          # container thinks it's running on real ARM hardware.
          # This avoids ALL cross-compilation issues (V8 pointer-size
          # mismatches, host/target arch confusion, etc.).
          docker run --rm \
            --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e VERSION="${VERSION}" \
            -e TARNAME="${TARNAME}" \
            debian:bookworm \
            bash -c '
              set -euo pipefail

              echo ">>> Running on: $(uname -m)"
              echo ">>> Building Node.js v${VERSION} for ARM"

              # Install build dependencies
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential \
                python3 \
                python3-pip \
                curl \
                xz-utils \
                pkg-config \
                ca-certificates

              # Download and extract Node.js source
              curl -fsSL "https://nodejs.org/dist/v${VERSION}/node-v${VERSION}.tar.xz" -o node.tar.xz
              tar -xf node.tar.xz
              cd "node-v${VERSION}"

              # Configure — no cross-compilation needed, this IS ARM
              ./configure \
                --dest-cpu=arm \
                --with-arm-float-abi=hard \
                --with-arm-fpu=vfpv3 \
                --prefix=/usr/local \
                --without-intl \
                --without-snapshot \
                --openssl-no-asm \
                2>&1 | tee /workspace/configure.log

              # Build
              make -j$(nproc) 2>&1 | tee /workspace/build.log

              # Stage the output
              STAGE="/workspace/dist/${TARNAME}"
              mkdir -p "${STAGE}/bin" "${STAGE}/lib/node_modules" "${STAGE}/include"

              cp out/Release/node "${STAGE}/bin/node"

              # npm
              cp -r deps/npm "${STAGE}/lib/node_modules/npm"
              ln -s ../lib/node_modules/npm/bin/npm-cli.js "${STAGE}/bin/npm"
              ln -s ../lib/node_modules/npm/bin/npx-cli.js "${STAGE}/bin/npx"

              # corepack
              if [ -d deps/corepack ]; then
                cp -r deps/corepack "${STAGE}/lib/node_modules/corepack"
                ln -s ../lib/node_modules/corepack/dist/corepack.js "${STAGE}/bin/corepack"
              fi

              # Headers
              cp -r src/*.h "${STAGE}/include/" 2>/dev/null || true

              # LICENSE
              cp LICENSE "${STAGE}/" 2>/dev/null || true

              echo ">>> Staged contents:"
              ls -lR "${STAGE}/bin/"
              file "${STAGE}/bin/node"
            '

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TARNAME=${TARNAME}" >> $GITHUB_ENV

      - name: Package tarball
        run: |
          mkdir -p release
          cd dist
          tar -czf "${{ github.workspace }}/release/${{ env.TARNAME }}.tar.gz" "${{ env.TARNAME }}"
          cd "${{ github.workspace }}"
          sha256sum release/${{ env.TARNAME }}.tar.gz > release/SHASUMS256.txt

          echo "Tarball created:"
          ls -lh release/

      - name: Upload build artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: node-armv7l-build
          path: |
            release/
            configure.log
            build.log
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          VERSION="${{ env.VERSION }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Node.js v${VERSION} Linux ARMv7l" \
            --notes "$(cat <<EOF
          ## Node.js v${VERSION} - Linux ARMv7l (hard-float)

          Unofficial ARMv7l (32-bit ARM hard-float) build of Node.js v${VERSION}.

          **Built with:**
          - Native ARM build via QEMU + Docker (debian:bookworm armhf)
          - Float ABI: hard
          - FPU: vfpv3
          - ICU / intl: disabled (reduces binary size; add \`--with-intl=small-icu\` in configure if needed)

          **SHA256:**
          \`\`\`
          $(cat release/SHASUMS256.txt)
          \`\`\`

          Built automatically by GitHub Actions. Source: https://nodejs.org/dist/v${VERSION}/
          EOF
          )" \
            release/*.tar.gz \
            release/SHASUMS256.txt

  notify-skip:
    name: Skipped (already built)
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.already_exists == 'true' && github.event.inputs.force_rebuild != 'true'
    steps:
      - run: echo "Release ${{ needs.check-version.outputs.tag_name }} already exists. Skipping build."
