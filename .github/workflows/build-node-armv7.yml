name: Build Node.js ARMv7

on:
  schedule:
    # Run weekly on Tuesdays at 00:00 UTC (~4.5h before YoutubeDL-Material build)
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to build (e.g. 24.0.0). Leave blank to use latest Node 24.'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild even if release already exists'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: build-node-armv7
  cancel-in-progress: false

env:
  NODE_MAJOR: 24
  ARCH: armv7l
  CROSS_TRIPLE: arm-linux-gnueabihf

jobs:
  check-version:
    name: Resolve Target Version
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.resolve.outputs.node_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      already_exists: ${{ steps.check_release.outputs.already_exists }}
    steps:
      - name: Resolve Node.js version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.node_version }}" ]; then
            VERSION="${{ github.event.inputs.node_version }}"
          else
            VERSION=$(curl -fsSL https://nodejs.org/dist/latest-v${{ env.NODE_MAJOR }}.x/SHASUMS256.txt \
              | head -1 | grep -oP 'node-v\K[0-9]+\.[0-9]+\.[0-9]+')
          fi
          echo "node_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION}-armv7l" >> $GITHUB_OUTPUT
          echo "Resolved Node.js version: ${VERSION}"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.resolve.outputs.node_version }}-armv7l"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "already_exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists."
          else
            echo "already_exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG does not exist yet, proceeding with build."
          fi

  build:
    name: Cross-Compile Node.js ${{ needs.check-version.outputs.node_version }} for ARMv7
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.already_exists == 'false' || github.event.inputs.force_rebuild == 'true'
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          # Detect system GCC major version
          GCC_VER=$(gcc -dumpversion | cut -d. -f1)
          echo "System GCC version: ${GCC_VER}"

          sudo dpkg --add-architecture i386
          sudo apt-get update -qq

          # Install ARM cross-compiler
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            python3 \
            python3-pip \
            ninja-build \
            pkg-config \
            curl \
            xz-utils

          # Install 32-bit dev libraries for V8 host tools (-m32 compilation).
          # V8 requires ia32 host when targeting ARM.
          sudo apt-get install -y --no-install-recommends \
            libc6-dev-i386 \
            "lib32stdc++-${GCC_VER}-dev"

          # Provide 32-bit asm headers. The linux-libc-dev package only ships
          # headers for the native arch; create symlink so -m32 finds them.
          # These headers (errno, ioctl, types, etc.) are identical across
          # x86_64 and i386 on Linux.
          sudo mkdir -p /usr/include/i386-linux-gnu
          sudo ln -sf /usr/include/x86_64-linux-gnu/asm /usr/include/i386-linux-gnu/asm

          echo "Toolchain ready."

      - name: Download Node.js source
        run: |
          VERSION="${{ needs.check-version.outputs.node_version }}"
          curl -fsSL "https://nodejs.org/dist/v${VERSION}/node-v${VERSION}.tar.xz" -o node.tar.xz
          tar -xf node.tar.xz
          echo "NODE_SRC=node-v${VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Configure Node.js for ARMv7 cross-compilation
        working-directory: ${{ env.NODE_SRC }}
        run: |
          # V8 requires host tools to be 32-bit (ia32) when targeting ARM.
          # --without-snapshot avoids building mksnapshot host tool.
          CC_host="gcc -m32" CXX_host="g++ -m32" \
          AR_host=ar RANLIB_host=ranlib \
          CC=${{ env.CROSS_TRIPLE }}-gcc \
          CXX=${{ env.CROSS_TRIPLE }}-g++ \
          AR=${{ env.CROSS_TRIPLE }}-ar \
          RANLIB=${{ env.CROSS_TRIPLE }}-ranlib \
          ./configure \
            --cross-compiling \
            --dest-cpu=arm \
            --dest-os=linux \
            --with-arm-float-abi=hard \
            --with-arm-fpu=vfpv3 \
            --prefix=/usr/local \
            --without-intl \
            --without-snapshot \
            --openssl-no-asm \
            2>&1 | tee ../configure.log

      - name: Build Node.js
        working-directory: ${{ env.NODE_SRC }}
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee ../build.log

      - name: Stage and package
        working-directory: ${{ env.NODE_SRC }}
        run: |
          # Skip 'make install' — it re-triggers V8 host builds that fail
          # on x86_64 when targeting ARM. Manually stage the output instead.
          TARNAME="node-v${{ env.VERSION }}-linux-armv7l"
          STAGE="${{ github.workspace }}/dist/${TARNAME}"

          mkdir -p "${STAGE}/bin" "${STAGE}/lib/node_modules" "${STAGE}/include"

          # Node binary
          cp out/Release/node "${STAGE}/bin/node"

          # npm (bundled in deps/npm)
          cp -r deps/npm "${STAGE}/lib/node_modules/npm"
          ln -s ../lib/node_modules/npm/bin/npm-cli.js "${STAGE}/bin/npm"
          ln -s ../lib/node_modules/npm/bin/npx-cli.js "${STAGE}/bin/npx"

          # corepack (bundled in deps/corepack)
          if [ -d deps/corepack ]; then
            cp -r deps/corepack "${STAGE}/lib/node_modules/corepack"
            ln -s ../lib/node_modules/corepack/dist/corepack.js "${STAGE}/bin/corepack"
          fi

          # Headers (for native addons)
          cp -r src/*.h "${STAGE}/include/" 2>/dev/null || true

          # LICENSE
          cp LICENSE "${STAGE}/" 2>/dev/null || true

          echo "Staged contents:"
          ls -lR "${STAGE}/bin/"
          file "${STAGE}/bin/node"

          # Create tarball
          mkdir -p "${{ github.workspace }}/release"
          cd "${{ github.workspace }}/dist"
          tar -czf "${{ github.workspace }}/release/${TARNAME}.tar.gz" "${TARNAME}"
          cd "${{ github.workspace }}"
          sha256sum release/${TARNAME}.tar.gz > release/SHASUMS256.txt

          echo "TARNAME=${TARNAME}" >> $GITHUB_ENV
          echo "Tarball created:"
          ls -lh release/

      - name: Upload build artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: node-armv7l-build
          path: |
            release/
            configure.log
            build.log
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          VERSION="${{ env.VERSION }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Node.js v${VERSION} Linux ARMv7l" \
            --notes "$(cat <<EOF
          ## Node.js v${VERSION} - Linux ARMv7l (hard-float)

          Unofficial ARMv7l (32-bit ARM hard-float) build of Node.js v${VERSION}.

          **Built with:**
          - Cross-compiler: \`${{ env.CROSS_TRIPLE }}-gcc\`
          - Float ABI: hard
          - FPU: vfpv3
          - Static binary (no external libc dependency beyond glibc)
          - ICU / intl: disabled (reduces binary size; add \`--with-intl=small-icu\` in configure if needed)

          **SHA256:**
          \`\`\`
          $(cat release/SHASUMS256.txt)
          \`\`\`

          Built automatically by GitHub Actions. Source: https://nodejs.org/dist/v${VERSION}/
          EOF
          )" \
            release/*.tar.gz \
            release/SHASUMS256.txt

  notify-skip:
    name: Skipped (already built)
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.already_exists == 'true' && github.event.inputs.force_rebuild != 'true'
    steps:
      - run: echo "Release ${{ needs.check-version.outputs.tag_name }} already exists. Skipping build."
